<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Ron's Designs and Signs</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" href="../images/tranparant half.png">
</head>

<body>
    <header>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
        <nav id="navMenu">
            <a href="../">Home</a>
            <a href="../services">Services</a>
            <a href="../gallery">Gallery</a>
            <a href="../contact">Contact</a>
        </nav>
        <img src="../images/tranparant half.png" alt="Logo" class="header-logo">
    </header>
    <script>
        const toggle = document.getElementById('menuToggle');
        const menu = document.getElementById('navMenu');
        toggle.addEventListener('click', () => {
            menu.classList.toggle('active');
            toggle.classList.toggle('active');
        });
        menu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                menu.classList.remove('active');
                toggle.classList.remove('active');
            });
        });
    </script>

    <div class="container gallery">
        <h1>Gallery</h1>
        <div class="grid">
            <img src="../images/work/agusta_farm.png" alt="Truck decal for Agusta Farm">
            <img src="../images/work/ahern.png" alt="Truck decal for Ahern">
            <img src="../images/work/apex_excavating.png" alt="Truck decal for Apex Excavating">
            <img src="../images/work/awaken_marine.png" alt="Storefront sign for Awaken Marine">
            <img src="../images/work/cadott_cross_country.png"
                alt="Poster for Cadott Boys Cross Country">
            <img src="../images/work/carlson_sons.png" alt="Truck decal for Carlson & Sons">
            <img src="../images/work/casa_poblana_shirt.png" alt="Shirt design for Casa Poblana">
            <img src="../images/work/fox_den.png" alt="Lighted sign for Foxx Den">
            <img src="../images/work/jacobsons.png" alt="Storefront sign for Jacobson's">
            <img src="../images/work/jj_sons.png" alt="Post and Panel sign for JJ & Sons">
            <img src="../images/work/john_deere_fridge.png" alt="john_deere_fridge">
            <img src="../images/work/lube_suppliers.png" alt="lube_suppliers">
            <img src="../images/work/rivian.png" alt="rivian">
            <img src="../images/work/stuve.png" alt="stuve">
            <img src="../images/work/tshirt.png" alt="tshirt">
            <img src="../images/work/turenne.png" alt="turenne">
        </div>
    </div>

    <footer>© Ron's Designs and Signs</footer>
</body>

</html>

<script src="../script.js"></script>
