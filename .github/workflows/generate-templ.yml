name: Generate Templ Files

on:
  push:
    paths:
      - 'templates/**/*.templ'
      - '.github/workflows/generate-templ.yml'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@latest
      
      - name: Generate templ files
        run: templ generate -path templates
      
      - name: Build CSS
        run: npx @tailwindcss/cli -i static/css/input.css -o static/css/output.css --minify
      
      - name: Commit generated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add templates/**/*_templ.go static/css/output.css
          git diff --staged --quiet || git commit -m "chore: generate templ and CSS files"
          git push
